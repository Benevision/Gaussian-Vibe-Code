name: SplatCapture
options:
  bundleIdPrefix: com.gunntower
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or pick it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: 8VBNKP8K93          # Benjamin Gunn (Personal Team)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SplatCapture:
    type: application
    platform: iOS
    sources:
      - path: SplatCapture
      - path: ../mac/Sources/SplatStudio/Worker/ZipReader.swift
      - path: ../mac/Sources/SplatStudio/Worker/ZipWriter.swift
    dependencies:
      - target: SplatTrainKit
    # No com.apple.developer.kernel.increased-memory-limit entitlement: a personal (free) Apple developer team
    # can't sign it ("requires a provisioning profile with the Increased Memory Limit feature"). Training on
    # the phone sizes its splat budget from os_proc_available_memory() either way. With a paid team, add:
    #   entitlements: { path: SplatCapture/Resources/SplatCapture.entitlements,
    #                   properties: { com.apple.developer.kernel.increased-memory-limit: true } }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gunntower.splatcapture
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        PRODUCT_NAME: SplatCapture
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ARCHS: arm64
        # The simulator is kept as a supported platform only so the code can be
        # compile-checked; ARKit world tracking does not run there.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SplatCapture/Resources/Info.plist
    info:
      path: SplatCapture/Resources/Info.plist
      properties:
        CFBundleDisplayName: SplatWork Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64, arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "SplatWork Capture uses the camera and LiDAR scanner to record posed images and depth for training Gaussian splats."
        NSLocalNetworkUsageDescription: "SplatWork Capture looks for SplatWork on your local network so it can send captures to your Mac and hand training to your Macs and PCs."
        NSBonjourServices: [_splatcapture._tcp, _splatworker._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # The Mac app's Metal trainer (mac/Sources/SplatStudio, Swift 5 language mode there), compiled for iOS from
  # the same files plus a small public facade (SplatTrainKit/TrainKit.swift). Kept in its own module so the
  # shared sources build in Swift 5 mode while the app stays Swift 6; optimised even in Debug because the
  # trainer's CPU-side densification is unusably slow at -Onone.
  SplatTrainKit:
    type: library.static
    platform: iOS
    sources:
      - path: SplatTrainKit
      - path: ../mac/Sources/SplatStudio/Core/Dataset.swift
      - path: ../mac/Sources/SplatStudio/Core/GaussianCloud.swift
      - path: ../mac/Sources/SplatStudio/Core/Orientation.swift
      - path: ../mac/Sources/SplatStudio/Core/TrainingConfig.swift
      # the whole trainer folder, so new trainer files are picked up (AutoClean is Mac-only tooling but compiles)
      - path: ../mac/Sources/SplatStudio/Train
      - path: ../mac/Sources/SplatStudio/Render/MetalContext.swift
      - path: ../mac/Sources/SplatStudio/Render/ViewerCamera.swift
      - path: ../mac/Sources/SplatStudio/Render/SplatScene.swift
      - path: ../mac/Sources/SplatStudio/Render/SplatRenderer.swift
      - path: ../mac/Sources/SplatStudio/Render/Coverage.swift
      - path: ../mac/Sources/SplatStudio/Shaders
      - path: ../mac/Sources/SplatStudio/Formats/PLY.swift
      # On-device preparation of iPhone captures (CaptureImporter → PreparedDataset, Apple Vision masks); the
      # Process / Python parts (splatprep, ditto) are #if os(macOS) — learned masks and solving go to a worker.
      - path: ../mac/Sources/SplatStudio/Pipeline/PipelineCommon.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Masking.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Importers/CaptureImporter.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Importers/DatasetWriting.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Poses/PoseCommon.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Poses/SplatPrepRunner.swift
      # referenced by the above (image remapping / undistortion, option types of the video & 360 sources)
      - path: ../mac/Sources/SplatStudio/Pipeline/ImageRemapper.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Sources/PhotoIngest.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Sources/VideoFrames.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Sources/Equirect360.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Sources/StereoSources.swift
      - path: ../mac/Sources/SplatStudio/Pipeline/Sources/StereoDepth.swift
      - path: ../mac/Sources/SplatStudio/Formats/SplatFormats.swift
      - path: ../mac/Sources/SplatStudio/Formats/CompressedPLY.swift
      # Offloading: discover SplatWork Nodes / Macs (_splatworker._tcp) and train on them, whole or in blocks.
      - path: ../mac/Sources/SplatStudio/Remote/WorkerClient.swift
      - path: ../mac/Sources/SplatStudio/Remote/WorkerBrowser.swift
      - path: ../mac/Sources/SplatStudio/Remote/ComputeScheduler.swift
      - path: ../mac/Sources/SplatStudio/Remote/BlockTraining.swift
      - path: ../mac/Sources/SplatStudio/Remote/PauseController.swift
      - path: ../mac/Sources/SplatStudio/Remote/RemoteStore.swift
      - path: ../mac/Sources/SplatStudio/Remote/SystemBenchmark.swift
      # the public facade (TrainKit / TrainKitJob, also used by SplatWork's "act as a worker") and the
      # pure-Swift zip (ZipUtil on iOS has no /usr/bin/ditto; also compiled into the app target)
      - path: ../mac/Sources/SplatStudio/Worker/TrainKit.swift
      - path: ../mac/Sources/SplatStudio/Worker/ZipWriter.swift
      - path: ../mac/Sources/SplatStudio/Worker/ZipReader.swift
    settings:
      base:
        SWIFT_INSTALL_OBJC_HEADER: NO   # pure Swift; XcodeGen's header-copy script fails under script sandboxing
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ARCHS: arm64
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        PRODUCT_NAME: SplatTrainKit
