# Builds the SplatWork Node Flatpak on every push that touches the worker (linux/, tools/) and
# publishes it as a Flatpak repository on GitHub Pages, so PCs that added the remote get updates
# through GNOME Software / Discover / `flatpak update` (see linux/README.md "Updates").
#
# One-time setup in the GitHub repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional signing (recommended): Settings → Secrets and variables → Actions →
#   FLATPAK_GPG_PRIVATE_KEY = output of `gpg --armor --export-secret-keys <KEYID>` (a key without a
#   passphrase, used only for this repo). Without it the repo is published unsigned and the remote
#   must be added with --no-gpg-verify (fine on a home network; HTTPS still protects the download).
name: SplatWork Node Flatpak

on:
  push:
    branches: [main]
    paths: ["linux/**", "tools/**", ".github/workflows/splat-worker-flatpak.yml"]
  # Pull requests run the tests and build the Flatpak without publishing anything.
  pull_request:
    paths: ["linux/**", "tools/**", ".github/workflows/splat-worker-flatpak.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: splat-worker-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

env:
  APP_ID: com.example.SplatWorker
  BRANCH: stable

jobs:
  # Worker + Studio tests (the OpenGL viewer tests render with Mesa llvmpipe through a headless EGL context).
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libopengl0
          python -m pip install fastapi "uvicorn[standard]" zeroconf numpy pillow httpx pytest pyyaml qrcode
      - name: pytest
        working-directory: linux
        env:
          PYTHONPATH: ../tools
        run: python -m pytest -q tests

  # Pull requests: the Flatpak must build (no repository, nothing published).
  flatpak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          cd linux/flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse build-dir \
            "$APP_ID.yml"
          ls build-dir/files/share/splatworker/lib/splatworker/studio/catalog.json

  # gsplat 1.6 is unreleased and has no prebuilt wheels: compile the pinned commit for the cu128 runtime
  # profile (PyTorch 2.7.1 + CUDA 12.8, RTX 20 → RTX 50 series). Cached per pin, so this only compiles
  # when linux/flatpak/gsplat-pin.env changes.
  gsplat-wheel:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Read pin
        id: pin
        run: |
          grep -v '^#' linux/flatpak/gsplat-pin.env | sed '/^$/d' >> "$GITHUB_OUTPUT"
          echo "key=gsplat-$(sha256sum linux/flatpak/gsplat-pin.env | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache wheel
        id: cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: ${{ steps.pin.outputs.key }}
      - name: Use a wheel attached to a GitHub Release (built on a PC with build-gsplat-wheel.sh --all)
        id: release
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          tag="gsplat-${{ steps.pin.outputs.GSPLAT_VERSION }}-${{ steps.pin.outputs.CUDA_TAG }}"
          if gh release download "$tag" --repo "${{ github.repository }}" --pattern "gsplat-*.whl" --dir wheels 2>/dev/null; then
            ls -la wheels; echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no release $tag with a wheel: compiling"; echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install CUDA toolkit
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-${{ steps.pin.outputs.CUDA_APT }}
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        with:
          python-version: "3.10"   # the worker's GPU runtime is CPython 3.10
      - name: Build gsplat wheel
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        env:
          TORCH_CUDA_ARCH_LIST: ${{ steps.pin.outputs.TORCH_CUDA_ARCH_LIST }}
          MAX_JOBS: "4"
          BUILD_EXPERIMENTAL: "0"
        run: |
          nvcc --version
          python -m pip install --upgrade pip wheel setuptools ninja numpy
          python -m pip install "torch==${{ steps.pin.outputs.TORCH_VERSION }}" --index-url https://download.pytorch.org/whl/${{ steps.pin.outputs.CUDA_TAG }}
          git clone --recursive https://github.com/nerfstudio-project/gsplat.git gsplat-src
          cd gsplat-src
          git checkout ${{ steps.pin.outputs.GSPLAT_COMMIT }}
          git submodule update --init --recursive
          TAG="pt$(echo ${{ steps.pin.outputs.TORCH_VERSION }} | cut -d. -f1,2 | tr -d .)${{ steps.pin.outputs.CUDA_TAG }}"
          sed -i "s/^__version__ = .*/__version__ = \"${{ steps.pin.outputs.GSPLAT_VERSION }}+${TAG}\"/" gsplat/version.py
          cat gsplat/version.py | tail -1
          # upstream bug at this commit: g++-built Utils.cpp uses nvcc's two-argument cudaEventCreate overload
          sed -i -E 's/cudaEventCreate\(([^,()]+), *cudaEventDisableTiming\)/cudaEventCreateWithFlags(\1, cudaEventDisableTiming)/g' gsplat/cuda/csrc/*.cpp
          python -m pip wheel --no-deps --no-build-isolation -w ../wheels .
          ls -la ../wheels
      - uses: actions/upload-artifact@v4
        with:
          name: gsplat-wheels
          path: wheels

  build:
    needs: [gsplat-wheel, tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Import signing key (optional)
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" | gpg --batch --import
            KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
            echo "keyid=$KEYID" >> "$GITHUB_OUTPUT"
            gpg --export "$KEYID" | base64 -w0 > pubkey.b64
          fi

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: linux/flatpak/.flatpak-builder
          key: fpb-${{ hashFiles('linux/flatpak/*.yml', 'linux/flatpak/python3-deps.json') }}-${{ github.sha }}
          restore-keys: fpb-${{ hashFiles('linux/flatpak/*.yml', 'linux/flatpak/python3-deps.json') }}-

      - name: Build into an OSTree repo
        run: |
          SIGN=()
          if [ -n "${{ steps.gpg.outputs.keyid }}" ]; then SIGN=(--gpg-sign="${{ steps.gpg.outputs.keyid }}"); fi
          mkdir -p site/flatpak   # flatpak-builder creates the repo dir itself, but not its parents
          cd linux/flatpak
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --state-dir=.flatpak-builder --repo=../../site/flatpak/repo --default-branch="$BRANCH" \
            "${SIGN[@]}" build-dir "$APP_ID.yml"
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=5 \
            --title="SplatWork Node" "${SIGN[@]}" ../../site/flatpak/repo

      - name: Write .flatpakrepo, .flatpakref and version.json
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
          BASE="https://$OWNER.github.io/$REPO/flatpak"
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linux/splatworker/__init__.py)
          GPGLINE=""; [ -f pubkey.b64 ] && GPGLINE="GPGKey=$(cat pubkey.b64)"
          cat > site/flatpak/splatworker.flatpakrepo <<REPO
          [Flatpak Repo]
          Title=SplatWork Node
          Url=$BASE/repo/
          Homepage=https://github.com/$GITHUB_REPOSITORY
          Comment=SplatWork's Linux GPU worker
          $GPGLINE
          REPO
          cat > site/flatpak/splatworker.flatpakref <<REF
          [Flatpak Ref]
          Name=$APP_ID
          Branch=$BRANCH
          Title=SplatWork Node
          Url=$BASE/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          $GPGLINE
          REF
          sed -i 's/^ *//' site/flatpak/splatworker.flatpakrepo site/flatpak/splatworker.flatpakref
          printf '{"version": "%s", "commit": "%s", "date": "%s"}\n' "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > site/flatpak/version.json
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>SplatWork Node</title>
          <h1>SplatWork Node $VERSION</h1>
          <p>Install on Linux: <code>flatpak install --user $BASE/splatworker.flatpakref</code></p>
          <p>Updates then arrive through GNOME Software / Discover or <code>flatpak update</code>.</p>
          HTML
          touch site/.nojekyll

      - uses: actions/download-artifact@v4
        with:
          name: gsplat-wheels
          path: site/wheels
      - name: Wheel index (pip --find-links)
        run: |
          cd site/wheels
          { echo "<!doctype html><title>SplatWork Node wheels</title>"; for f in *.whl; do echo "<a href=\"$f\">$f</a><br>"; done; } > index.html
          cat index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
