# Suite release: push a tag like v1.4.0 and this builds
#   * SplatWork for Mac (Apple silicon) as a .dmg — version = the tag
#   * SplatWork for Linux for Linux as a single-file .flatpak (its own version, linux/splatworker/__init__.py)
# and publishes them on one GitHub Release with SHA-256 checksums and install notes.
#
#   git tag -a v1.4.0 -m "SplatWork 1.4.0" && git push origin v1.4.0
#
# Workers that added the Flatpak remote keep updating on every push to main (splat-worker-flatpak.yml);
# the release bundle is for new installs and for PCs without the remote.
#
# Mac signing: ad-hoc unless these repository secrets exist, in which case the app is signed with a
# Developer ID, notarized and stapled (opens without warnings):
#   MACOS_CERTIFICATE_P12      base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_ID                   Apple ID email of the developer account
#   APPLE_APP_PASSWORD         app-specific password for that Apple ID (appleid.apple.com)
#   APPLE_TEAM_ID              10-character team ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build (no release is published), e.g. 1.4.0-rc1"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build number = commit count
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build SplatWork.app
        env:
          SPLAT_VERSION: ${{ steps.v.outputs.version }}
        run: |
          swift --version
          mac/scripts/build_app.sh
      - name: Sign with Developer ID and notarize (when the secrets are set)
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P12" ]; then echo "no signing secrets: keeping the ad-hoc signature"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"; KCPW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          APP="mac/build/SplatWork.app"
          codesign --force --deep --options runtime --timestamp --sign "$ID" "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
      - name: Package .dmg
        run: mac/scripts/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/*.dmg

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: linux/flatpak/.flatpak-builder
          key: fpb-bundle-${{ hashFiles('linux/flatpak/*.yml', 'linux/flatpak/python3-deps.json') }}-${{ github.sha }}
          restore-keys: fpb-bundle-${{ hashFiles('linux/flatpak/*.yml', 'linux/flatpak/python3-deps.json') }}-
      - name: Build single-file bundle
        run: |
          export SPLAT_REPO_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/flatpak/repo/"
          linux/flatpak/make-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: linux/flatpak/dist/*.flatpak

  release:
    needs: [mac, worker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        id: notes
        env:
          NOTARIZED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          DMG=$(cd dist && ls *.dmg); FP=$(cd dist && ls *.flatpak)
          WV=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linux/splatworker/__init__.py)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"
          SIGNED="ad-hoc signed (not notarized): the first time, right-click the app → **Open** → **Open**, or run \`xattr -dr com.apple.quarantine \"/Applications/SplatWork.app\"\`."
          [ "$NOTARIZED" = "true" ] && SIGNED="signed with a Developer ID and notarized."
          V="${GITHUB_REF_NAME#v}"
          # The release's section of CHANGELOG.md ("## 1.2.0 — date" up to the next "## "), as the highlights
          awk -v v="$V" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > highlights.md || true
          {
            if [ -s highlights.md ]; then echo "## What's new"; cat highlights.md; echo; fi
            echo "## Install"
            echo
            echo "**Mac (Apple silicon, macOS 15 or later)** — \`$DMG\`: open it and drag SplatWork to Applications. This build is $SIGNED"
            echo
            echo "**Linux GPU worker (NVIDIA)** — SplatWork for Linux $WV, \`$FP\`:"
            echo '```'
            echo "flatpak install --user $FP"
            echo '```'
            echo "On first start its setup assistant downloads PyTorch, CUDA and gsplat for your driver (about 3 GB). To get updates automatically instead, add the repository: \`flatpak install --user https://$OWNER.github.io/$REPO/flatpak/splatworker.flatpakref\`."
            echo
            echo "**iPhone (SplatWork Capture)** — not included: iOS apps can't be installed from a download; build it from \`ios/\` in Xcode."
            echo
            echo "## All changes"
            echo
            if [ -n "$PREV" ]; then git log --no-merges --format='* %s' "$PREV..HEAD"; else git log --no-merges --format='* %s' -n 40; fi
          } > notes.md
          cat notes.md
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "SplatWork ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
