# Developer builds of SplatWork for Mac: every push to main that touches the Mac app rebuilds it and replaces
# the rolling pre-release "dev" (tag moves to the new commit). The app's Settings → Updates → "Developer builds"
# switch follows it: an update is offered whenever the dev build number (commit count) is higher than the
# installed one. The normal release channel (releases/latest) ignores pre-releases, so this never reaches
# people on the release channel.
name: Mac developer build

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac-dev.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build number = commit count, version = last v* tag + "-dev"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build SplatWork.app and .dmg
        run: |
          mac/scripts/build_app.sh
          mac/scripts/make_dmg.sh
      - name: Publish the rolling "dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=mac/build/SplatWork.app
          V=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")
          mkdir dist && cp mac/build/*.dmg dist/
          printf '{"version": "%s", "build": %s, "commit": "%s", "date": "%s"}\n' "$V" "$B" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/build.json
          (cd dist && shasum -a 256 *.dmg build.json > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "Developer build $V (build $B) from \`${GITHUB_SHA:0:7}\` — rebuilt on every push to main; may be unstable."
            echo "Turn on SplatWork → Settings → Updates → **Developer builds** to update to these automatically."
            echo
            echo "## Recent changes"
            git log --no-merges --format='* %s' -n 15
          } > notes.md
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "SplatWork developer build $B" --notes-file notes.md
